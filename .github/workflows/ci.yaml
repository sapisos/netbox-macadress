---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff==0.14.14

      - name: Run Ruff
        run: |
          ruff check netbox_macadress/
          ruff format --check netbox_macadress/

  test:
    name: Test (NetBox ${{ matrix.netbox-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        netbox-version: ['v4.5.10', 'v4.6.10', 'v4.7.2']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      REDIS_HOST: localhost

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone NetBox
        run: git clone --depth 1 --branch ${{ matrix.netbox-version }} https://github.com/netbox-community/netbox.git

      - name: Install NetBox and the plugin
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install -e plugin
          cp plugin/testing/configuration.py netbox/netbox/netbox/configuration.py

      - name: Run database migrations
        working-directory: netbox/netbox
        run: python manage.py migrate --no-input

      - name: Check for missing migrations
        working-directory: netbox/netbox
        run: python manage.py makemigrations --check netbox_macadress

      - name: Run tests
        working-directory: netbox/netbox
        run: python manage.py test netbox_macadress.tests --keepdb -v 2
